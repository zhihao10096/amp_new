[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-supermimic"
version = "0.1.0"
description = "Unitree Go2 velocity tracking with SuperMimic model-based RL in Isaac Lab"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ziyue Zheng", email = "zzheng60@jh.edu" }]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "mediapy",
  "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest"]
isaac = ["isaaclab[isaacsim]==2.1.0"]

[tool.setuptools.packages.find]
include = ["go2_supermimic*"]
